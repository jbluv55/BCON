    <!-- Olive branch green twig in beak -->
    <path d="M 125,105 C 115,115 110,126 95,130 C 85,133 75,128 65,120" fill="none" stroke="#059669" stroke-width="2.5" />
    <path d="M 115,110 Q 112,104 118,106 Z" fill="#10B981" />
    <path d="M 105,115 Q 102,109 108,111 Z" fill="#10B981" />
    <path d="M 95,120 Q 92,114 98,116 Z" fill="#10B981" />
    <path d="M 85,123 Q 82,117 88,119 Z" fill="#10B981" />
  </g>

  <!-- Left double vertical gold lines beside the text -->
  <line x1="115" y1="240" x2="115" y2="415" stroke="#d97706" stroke-width="3" />
  <line x1="123" y1="240" x2="123" y2="415" stroke="#d97706" stroke-width="3" />

  <!-- The stylized typographic branding text with inline blue fill and navy blue contours -->
  <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="950" font-style="italic" letter-spacing="0.5">
    <text x="140" y="278" font-size="34" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2">BRIDGE COLLEGE</text>
    <text x="140" y="322" font-size="30" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2">OF NURSING AND</text>
    <text x="140" y="366" font-size="30" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2">HEALTH</text>
    <text x="140" y="410" font-size="34" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2">SCIENCES</text>
  </g>

  <!-- Double horizontal gold lines below the text -->
  <line x1="140" y1="428" x2="270" y2="428" stroke="#d97706" stroke-width="3" />
  <line x1="140" y1="436" x2="270" y2="436" stroke="#d97706" stroke-width="3" />
</svg>
