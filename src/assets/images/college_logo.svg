<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Circular container background -->
  <circle cx="250" cy="250" r="235" fill="#ffffff" />

  <!-- Multi-layered fine wireframe waves on the right -->
  <g opacity="0.8">
    <path d="M 230,60 Q 470,110 440,300 T 250,440" fill="none" stroke="#00acc1" stroke-width="1.5" />
    <path d="M 240,58 Q 472,115 443,298 T 255,442" fill="none" stroke="#22d3ee" stroke-width="1.2" />
    <path d="M 250,56 Q 474,120 446,296 T 260,444" fill="none" stroke="#06b6d4" stroke-width="1.0" />
    <path d="M 260,54 Q 476,125 449,294 T 265,446" fill="none" stroke="#0891b2" stroke-width="0.8" />
    
    <path d="M 235,62 Q 468,108 438,302 T 248,438" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 245,60 Q 470,113 441,300 T 253,440" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <path d="M 255,58 Q 472,118 444,298 T 258,442" fill="none" stroke="#d97706" stroke-width="1.0" />
    <path d="M 265,56 Q 474,123 447,296 T 263,444" fill="none" stroke="#b45309" stroke-width="0.8" />
  </g>

